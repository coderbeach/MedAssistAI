model_name: "resnet50"
num_classes: 13
image_size: 224
batch_size: 16
weight_decay: 0.01
dropout: 0.3
seed: 42

# 3-Stage Training Parameters
stage1:
  epochs: 5
  lr: 0.001
  unfreeze_layers: ["fc"] # Stage 1: only classification head

stage2:
  epochs: 10
  lr: 0.0001
  unfreeze_layers: ["layer4", "fc"] # Stage 2: unfreeze final blocks

stage3:
  epochs: 5
  lr: 0.00001
  unfreeze_layers: ["all"] # Stage 3: unfreeze entire backbone

# Data Augmentation strength
aug_strength: "moderate"
